name: Check PR Template

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR description against template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          ERRORS=()

          if [ -z "${PR_BODY//[[:space:]]/}" ]; then
            ERRORS+=("PR 描述为空，请使用 .github/PULL_REQUEST_TEMPLATE.md 填写")
          else
            # 去掉 HTML 注释，避免把占位说明当成正文
            BODY=$(printf '%s\n' "$PR_BODY" | sed -E 's/<!--([^-]|-[^-]|--[^>])*-->//g')

            # 变更摘要：下一节之前必须有非空正文
            SUMMARY=$(printf '%s\n' "$BODY" | awk '
              /^## 变更摘要/ {flag=1; next}
              /^## / {if(flag) exit}
              flag {print}
            ' | sed '/^[[:space:]]*$/d')
            if [ -z "$SUMMARY" ]; then
              ERRORS+=("缺少「变更摘要」正文（1～3 句话说明改了什么、为什么改）")
            fi

            # 影响模块：不锁定选项名；可随意增删改勾选项或改成正文
            # 通过条件：该节内有已勾选，或有非空正文（忽略未勾选项与空行）
            MODULE_SECTION=$(printf '%s\n' "$BODY" | awk '
              /^## 影响模块/ {flag=1; next}
              /^## / {if(flag) exit}
              flag {print}
            ')
            MODULE_CHECKED=$(printf '%s\n' "$MODULE_SECTION" | grep -Eic '^[[:space:]]*[-*][[:space:]]*\[[xX]\]' || true)
            MODULE_TEXT=$(printf '%s\n' "$MODULE_SECTION" \
              | sed -E '/^[[:space:]]*[-*][[:space:]]*\[[[:space:]xX]\]/d; /^###/d; /^[[:space:]]*$/d')
            if [ "$MODULE_CHECKED" -eq 0 ] && [ -z "$MODULE_TEXT" ]; then
              ERRORS+=("「影响模块」不能为空：请至少勾选一项，或自行改写/填写影响范围")
            fi

            # 测试情况：不锁定选项文案；有已勾选或非空正文即可
            TEST_SECTION=$(printf '%s\n' "$BODY" | awk '
              /^## 测试情况/ {flag=1; next}
              /^## / {if(flag) exit}
              flag {print}
            ')
            TEST_CHECKED=$(printf '%s\n' "$TEST_SECTION" | grep -Eic '^[[:space:]]*[-*][[:space:]]*\[[xX]\]' || true)
            TEST_TEXT=$(printf '%s\n' "$TEST_SECTION" \
              | sed -E '/^[[:space:]]*[-*][[:space:]]*\[[[:space:]xX]\]/d; /^###/d; /^[[:space:]]*$/d')
            if [ "$TEST_CHECKED" -eq 0 ] && [ -z "$TEST_TEXT" ]; then
              ERRORS+=("「测试情况」不能为空：请至少勾选一项，或自行说明测试情况")
            fi

            # 关联问题：下一节之前必须有非空内容（如 #12 或「无」）
            ISSUE=$(printf '%s\n' "$BODY" | awk '
              /^## 关联问题/ {flag=1; next}
              /^## / {if(flag) exit}
              flag {print}
            ' | sed '/^[[:space:]]*$/d; /^[[:space:]]*-[[:space:]]*$/d')
            if [ -z "$ISSUE" ]; then
              ERRORS+=("缺少「关联问题」（填写 Issue 如 #12，无则写「无」）")
            fi

            # 自审确认：必须勾选
            if ! printf '%s\n' "$BODY" | grep -Eiq '^[[:space:]]*[-*][[:space:]]*\[[xX]\][[:space:]]*我已经仔细阅读上述内容，确认无误'; then
              ERRORS+=("请勾选「自审确认」：我已经仔细阅读上述内容，确认无误")
            fi
          fi

          if [ ${#ERRORS[@]} -gt 0 ]; then
            echo "::error::PR 模板校验失败，请按 .github/PULL_REQUEST_TEMPLATE.md 补全描述"
            printf '%s\n' "${ERRORS[@]}" | while read -r line; do
              echo "❌ $line"
              echo "::error::$line"
            done
            exit 1
          fi

          echo "✅ PR 模板校验通过"
